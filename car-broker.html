<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر السيارات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16283D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر السيارات">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --navy:#16283D;
    --navy-light:#22394F;
    --bg:#EFF2F0;
    --card:#FFFFFF;
    --gold:#B8874B;
    --gold-light:#F3E7D3;
    --green:#3F7D5C;
    --green-light:#E4F0EA;
    --coral:#C1553A;
    --coral-light:#FBE9E4;
    --text:#1E2530;
    --muted:#6B7280;
    --border:#DFE3E0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Tahoma",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding-bottom:60px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--navy);
    color:#fff;
    padding:22px 16px 70px;
    margin-bottom:-54px;
  }
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;}
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.top .sub{color:#B9C3CE;font-size:12.5px;margin-top:3px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  @media(min-width:520px){
    .stats{grid-template-columns:repeat(4,1fr);}
  }
  .stat{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px 10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(22,40,61,.07);
  }
  .stat .num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .stat.profit .num{color:var(--gold);}
  .stat.due-in .num{color:var(--coral);}
  .stat.due-out .num{color:var(--navy);}

  .tabbar{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{
    flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted);
    cursor:pointer;font-family:inherit;
